services:
  - type: web
    name: agrisense-bctb-model
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: cd ml && uvicorn api:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: RESEARCH_MODEL_API_KEY
        sync: false
      - key: PYTHON_VERSION
        value: 3.11.11
